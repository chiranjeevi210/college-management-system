<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMS Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; margin: 0; padding: 2rem; color: #1e293b; }
    .header { display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 0 auto 1.5rem; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem; }
    input, button { padding: 0.6rem; border-radius: 6px; border: 1px solid #cbd5e1; }
    button { background: #2563eb; color: white; border: none; cursor: pointer; font-weight: 600; }
    .logout-btn { background: #ef4444; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid #e2e8f0; }
    th { background: #f1f5f9; }
  </style>
</head>
<body>
  <div class="header">
    <h2>College Management Dashboard</h2>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="container">
    <h3>Add Student Record</h3>
    <form id="student-form" class="form-grid">
      <input type="text" id="roll_number" placeholder="Roll No (e.g., CS102)" required />
      <input type="text" id="full_name" placeholder="Full Name" required />
      <input type="text" id="department" placeholder="Department" required />
      <input type="number" step="0.1" id="attendance_pct" placeholder="Attendance %" required />
      <input type="number" step="0.1" id="gpa" placeholder="GPA" required />
      <button type="submit">Add Student</button>
    </form>

    <h3>Enrolled Students</h3>
    <table>
      <thead>
        <tr>
          <th>Roll No</th>
          <th>Name</th>
          <th>Department</th>
          <th>Attendance</th>
          <th>GPA</th>
        </tr>
      </thead>
      <tbody id="student-table-body"></tbody>
    </table>

    <hr style="margin: 2rem 0; border: 0; border-top: 1px solid #e2e8f0;" />

    <!-- Notices Section -->
    <h3>College Notices & Announcements</h3>
    <form id="notice-form" class="form-grid admin-only">
      <input type="text" id="notice-title" placeholder="Notice Title" required />
      <input type="text" id="notice-content" placeholder="Announcement Details" required />
      <button type="submit">Post Notice</button>
    </form>
    <div id="notices-list"></div>

    <hr style="margin: 2rem 0; border: 0; border-top: 1px solid #e2e8f0;" />

    <!-- Course Registration Section -->
    <h3>Course Registration</h3>
    <table>
      <thead>
        <tr>
          <th>Code</th>
          <th>Course Name</th>
          <th>Credits</th>
          <th>Status / Action</th>
        </tr>
      </thead>
      <tbody id="courses-table-body"></tbody>
    </table>
  </div>

  <script src="js/config.js"></script>
  <script>
    // Protect route: redirect to login if no active session
    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
      } else {
        loadStudents();
        loadNotices();
        loadCourses();
      }
    }

    // Fetch and display students
    async function loadStudents() {
      const { data, error } = await supabaseClient.from('students').select('*').order('roll_number');
      if (error) return console.error(error);

      const tbody = document.getElementById('student-table-body');
      tbody.innerHTML = (data || []).map(s => `
        <tr>
          <td>${s.roll_number}</td>
          <td>${s.full_name}</td>
          <td>${s.department}</td>
          <td>${s.attendance_pct}%</td>
          <td>${s.gpa}</td>
        </tr>
      `).join('');
    }

    // Insert new student
    document.getElementById('student-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newStudent = {
        roll_number: document.getElementById('roll_number').value,
        full_name: document.getElementById('full_name').value,
        department: document.getElementById('department').value,
        attendance_pct: parseFloat(document.getElementById('attendance_pct').value),
        gpa: parseFloat(document.getElementById('gpa').value)
      };

      const { error } = await supabaseClient.from('students').insert([newStudent]);
      if (error) alert('Error: ' + error.message);
      else {
        e.target.reset();
        loadStudents();
      }
    });

    // Fetch and display notices
    async function loadNotices() {
      const { data } = await supabaseClient.from('notices').select('*').order('created_at', { ascending: false });
      document.getElementById('notices-list').innerHTML = (data || []).map(n => `
        <div style="background:#f1f5f9; padding:0.75rem 1rem; border-radius:6px; margin-bottom:0.5rem;">
          <strong>${n.title}</strong>
          <p style="margin:0.25rem 0 0; font-size:0.9rem;">${n.content}</p>
        </div>
      `).join('');
    }

    // Post a new notice (admin only via RLS)
    document.getElementById('notice-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { error } = await supabaseClient.from('notices').insert([{
        title: document.getElementById('notice-title').value,
        content: document.getElementById('notice-content').value
      }]);
      if (error) alert('Error: ' + error.message);
      else {
        e.target.reset();
        loadNotices();
      }
    });

    // Fetch courses and user enrollment status
    async function loadCourses() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const { data: courses } = await supabaseClient.from('courses').select('*');
      const { data: enrolled } = await supabaseClient.from('enrollments').select('course_code').eq('user_id', session.user.id);
      const enrolledCodes = new Set((enrolled || []).map(e => e.course_code));

      document.getElementById('courses-table-body').innerHTML = (courses || []).map(c => {
        const isRegistered = enrolledCodes.has(c.course_code);
        return `
          <tr>
            <td>${c.course_code}</td>
            <td>${c.course_name}</td>
            <td>${c.credits}</td>
            <td>
              ${isRegistered
                ? `<span style="color:#16a34a; font-weight:bold;">Registered</span>`
                : `<button onclick="registerCourse('${c.course_code}')">Register</button>`}
            </td>
          </tr>
        `;
      }).join('');
    }

    // Register for a course
    async function registerCourse(courseCode) {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const { error } = await supabaseClient.from('enrollments').insert([{ user_id: session.user.id, course_code: courseCode }]);
      if (error) alert(error.message);
      else loadCourses();
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }

    checkAuth();
  </script>
</body>
</html>
